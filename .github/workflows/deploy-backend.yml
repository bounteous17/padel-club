name: Deploy Backend (Lambda)

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build TypeScript
        working-directory: backend
        run: npm run build

      - name: Install production dependencies in dist
        working-directory: backend/dist
        run: npm ci --omit=dev --ignore-scripts

      - name: Generate Prisma client in dist
        working-directory: backend/dist
        run: npx prisma generate

      - name: Create Lambda deployment package
        working-directory: backend/dist
        run: |
          zip -r ../lambda.zip . -x "*.map" "*.ts" "*.md"
          echo "Lambda package size: $(du -h ../lambda.zip | cut -f1)"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Lambda
        working-directory: backend
        run: |
          aws lambda update-function-code \
            --function-name ${{ vars.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://lambda.zip
          
          echo "Waiting for Lambda update to complete..."
          aws lambda wait function-updated \
            --function-name ${{ vars.LAMBDA_FUNCTION_NAME }}
          
          echo "Lambda function deployed successfully!"
          echo "Function: ${{ vars.LAMBDA_FUNCTION_NAME }}"
          echo "API URL: https://${{ vars.API_DOMAIN }}"
